<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 3.2 - Container Row Column</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-5">

        <h2 class="text-center mb-4">
            Bootstrap Responsive Grid
        </h2>

        <div class="row g-3">

            <div class="col-12 col-md-6 col-lg-4">
                <div class="bg-primary text-white p-4 rounded text-center">
                    Column 1
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="bg-success text-white p-4 rounded text-center">
                    Column 2
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="bg-warning text-dark p-4 rounded text-center">
                    Column 3
                </div>
            </div>

        </div>

    </div>

</body>
</html>
