<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 4.1 - Sidebar Layout</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-4">

        <div class="row">

            <!-- Sidebar -->
            <div class="col-md-3">
                <div class="bg-dark text-white p-4 rounded">
                    <h4>Sidebar</h4>
                    <ul class="list-unstyled">
                        <li>Dashboard</li>
                        <li>Profile</li>
                        <li>Settings</li>
                        <li>Reports</li>
                    </ul>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9">
                <div class="bg-light p-4 rounded">
                    <h2>Main Content Area</h2>
                    <p>
                        This section occupies 9 columns while the sidebar occupies 3 columns.
                        Together they form a 12-column Bootstrap grid layout.
                    </p>

                    <p>
                        On smaller screens, the columns automatically stack vertically.
                    </p>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
